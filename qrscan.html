<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMAL G.C. - VIP Digital Business Card</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card-container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            width: 380px;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.2);
            border: 2px solid #d4af37;
            text-align: center;
            box-sizing: border-box;
            color: #fff;
        }
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #d4af37, #fff, #d4af37);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d4af37;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .profile-name i {
            font-size: 16px;
            color: #d4af37;
        }
        .profile-title {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        /* Vertical List Style for All Items */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .link-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: left;
        }
        .link-item i {
            font-size: 18px;
            color: #d4af37;
            width: 25px;
            text-align: center;
        }
        .link-item:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            transform: translateY(-2px);
        }
        .footer-text {
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">

            </a>

            </a>
            <!-- 4. Facebook Profile -->

            <!-- 5. Facebook Page -->

            <!-- 6. Instagram -->

            <!-- 9. Digital Notebook (DN Subdomain) -->

            </a>
        </div>

        <div class="footer-text">

    </div>

</body>
