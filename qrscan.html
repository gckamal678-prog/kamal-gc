<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMAL G.C. - VIP Digital Business Card</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card-container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            width: 380px;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.2);
            border: 2px solid #d4af37;
            text-align: center;
            box-sizing: border-box;
            color: #fff;
        }
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #d4af37, #fff, #d4af37);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d4af37;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .profile-name i {
            font-size: 16px;
            color: #d4af37;
        }
        .profile-title {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .profile-title a {
            color: #aaa;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .profile-title a:hover {
            color: #d4af37;
        }
        /* Contact List Links Box */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .contact-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .contact-item i {
            font-size: 18px;
            color: #d4af37;
            width: 25px;
            text-align: center;
        }
        .contact-item:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            transform: translateY(-2px);
        }
        /* Social Links Box */
        .social-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .social-links a {
            color: #ccc;
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-links a:hover {
            color: #d4af37;
            transform: scale(1.15);
        }
        .footer-text {
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Profile Avatar -->
        <div class="avatar-box">
            <img src="avtar.jpg" alt="KAMAL G.C.">
        </div>

        <div class="profile-name">
            KAMAL G.C. <i class="fa-solid fa-certificate" title="VIP Verified"></i>
        </div>
        <div class="profile-title">
            <a href="https://maps.app.goo.gl/Txq4BzhCLZWK36e3A" target="_blank">
                <i class="fa-solid fa-location-dot"></i> शिवराज ९ अञ्चलपुर
            </a>
        </div>

        <!-- Contact Options with Real Icons & Direct Links -->
        <div class="contact-list">
            <!-- WhatsApp Link -->
            <a href="https://wa.me/9779821406500" target="_blank" class="contact-item">
                <i class="fa-brands fa-whatsapp"></i> +977 9821406500
            </a>
            <!-- Email Link -->
            <a href="mailto:info@kamalgc.com.np" class="contact-item">
                <i class="fa-solid fa-envelope"></i> info.kamalgc.com.np
            </a>
        </div>

        <!-- Social Media Links Box -->
        <div class="social-box">
            <div class="social-links">
                <!-- Facebook Profile -->
                <a href="https://www.facebook.com/share/1C2yZkz7MS" target="_blank" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <!-- Facebook Page -->
                <a href="https://www.facebook.com/share/19H7Jj6U8y" target="_blank" title="Facebook Page"><i class="fa-brands fa-facebook"></i></a>
                <!-- Instagram -->
                <a href="https://www.instagram.com/chhetrikamal97?stkn=MTgzcml5czdlaHV2eQ" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <!-- YouTube -->
                <a href="https://youtube.com/@sk_official97?si=ayrDWurrapho9GxK" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>

        <div class="footer-text">
            &copy; 2026 kamalgc.com.np All Right Reserved
        </div>
    </div>

</body>
</html>
