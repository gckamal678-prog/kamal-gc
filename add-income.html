<script>
    // PDF जेनेरेट गर्ने र bannerlogo.png लाई profile photo र address को बीचमा ठीक center मा मिलाउने फंक्सन
    function generateAndShareIncomePDF() {
        let incomes = JSON.parse(localStorage.getItem('digital_notebook_incomes') || '[]');
        if(incomes.length === 0) {
            showToast('PDF बनाउन कुनै डाटा छैन!', 'error');
            return;
        }

        const profileName = localStorage.getItem('profile_name') || 'Digital NoteBook';
        const profileAddress = localStorage.getItem('profile_address') || '';
        const profileMobile = localStorage.getItem('profile_mobile') || '';
        const profileEmail = localStorage.getItem('profile_email') || '';
        const profileAvatar = localStorage.getItem('profile_avatar') || 'N1024.png';

        let previewContainer = document.getElementById('pdf-preview-container');
        
        let html = `
        <div id="pdf-printable-content" style="background-color: #ffffff; color: #333333; font-family: 'Poppins', sans-serif; width: 100%; max-width: 650px; padding: 25px; border-radius: 12px; box-sizing: border-box;">
            <table style="width: 100%; border-bottom: 2px solid #16a34a; padding-bottom: 15px; margin-bottom: 20px; border-collapse: collapse;">
                <tr>
                    <!-- बायाँतर्फ प्रोफाइल फोटो र नाम -->
                    <td style="vertical-align: middle; width: 25%;">
                        <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; border: 2px solid #16a34a; margin-bottom: 4px;">
                            <img src="${profileAvatar}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div style="font-size: 11px; font-weight: 700; color: #1f2937;">${profileName}</div>
                    </td>

                    <!-- ठीक बीचमा bannerlogo.png (6000x1500px व्यवस्थापन गरिएको) -->
                    <td style="vertical-align: middle; text-align: center; width: 42%; padding: 0 10px;">
                        <img src="bannerlogo.png" style="width: 100%; max-height: 48px; object-fit: contain; display: block; margin: 0 auto;">
                    </td>

                    <!-- दायाँतर्फ ठेगाना र विवरण -->
                    <td style="vertical-align: middle; text-align: right; font-size: 10px; color: #555; line-height: 1.4; width: 33%;">
                        <div>📍 ${profileAddress}</div>
                        <div>📞 ${profileMobile}</div>
                        <div>✉️ ${profileEmail}</div>
                    </td>
                </tr>
            </table>

            <h2 style="text-align: center; color: #1f2937; margin-bottom: 20px; text-transform: uppercase; font-size: 15px; font-weight: 800; letter-spacing: 1px;">Income Report</h2>

            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                    <tr style="background-color: #f3f4f6; color: #374151;">
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Date</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Title</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Category</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">NPR</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">INR</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Total (NPR)</th>
                    </tr>
                </thead>
                <tbody>`;

        let grandTotal = 0;
        incomes.forEach(item => {
            grandTotal += item.total;
            html += `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 9px;">${item.date}</td>
                    <td style="padding: 9px;">${item.sourceName}</td>
                    <td style="padding: 9px;">Income</td>
                    <td style="padding: 9px;">${item.npr}</td>
                    <td style="padding: 9px;">${item.inr}</td>
                    <td style="padding: 9px; font-weight: bold; color: #16a34a;">Rs ${item.total.toFixed(2)}</td>
                </tr>`;
        });

        html += `
                </tbody>
            </table>

            <div style="margin-top: 20px; text-align: right; font-size: 14px; font-weight: bold; color: #16a34a; border-top: 2px solid #16a34a; padding-top: 15px;">
                Grand Total: Rs ${grandTotal.toFixed(2)}
            </div>
            
            <div style="text-align: center; font-size: 10px; color: #9ca3af; margin-top: 30px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                Generated by Digital NoteBook | ${new Date().toLocaleDateString('en-NP')}
            </div>
        </div>`;

        previewContainer.innerHTML = html;
        document.getElementById('pdf-modal').classList.remove('hidden');
    }
</script>
