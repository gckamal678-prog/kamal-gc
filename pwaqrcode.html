<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install App</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 320px;
            width: 90%;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0084ff;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            background: #0084ff;
            color: white;
            padding: 12px 0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,132,255,0.3);
            margin-bottom: 10px;
        }
        .btn:active {
            background: #006dd6;
        }
        .share-btn {
            background: #25D366;
            box-shadow: 0 2px 6px rgba(37,211,102,0.3);
        }
        .share-btn:active {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- रूट फोल्डरबाट लोगो देखाउने (avatar.jpg) -->
        <img src="avtar.jpg" alt="App Logo" class="avtar">
        
        <h2>Install Our App</h2>
        <p>Click the button below to install this app directly on your mobile home screen.</p>
        
        <!-- इन्स्टल गर्ने बटन -->
        <button id="installBtn" class="btn">Install App Now</button>
        
        <!-- WhatsApp मा सेयर गर्ने बटन -->
        <button onclick="shareOnWhatsApp()" class="btn share-btn">Share on WhatsApp</button>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        // PWA इन्स्टल प्रम्प्ट समात्ने
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        // इन्स्टल बटनमा क्लिक गर्दा पपअप देखाउने
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
            } else {
                alert("To install, please use your browser menu (three dots) and select 'Add to Home Screen' or 'Install App'.");
            }
        });

        // WhatsApp मा सेयर गर्ने फंक्सन
        function shareOnWhatsApp() {
            const currentUrl = window.location.href;
            const message = "Check out and install our app here: " + currentUrl;
            const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
        }
    </script>

</body>
</html>
