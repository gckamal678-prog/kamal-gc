<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Me - PWA App</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg max-w-sm w-full flex flex-col items-center text-center space-y-4">
        
        <!-- QR Code Wrapper with Center Logo -->
        <div id="qrcodeWrapper" class="relative inline-block p-3 bg-white rounded-xl shadow-inner">
            <div id="qrcode" class="flex justify-center items-center"></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-9 h-9 rounded-full bg-white border-2 border-emerald-600 p-0.5 shadow-md overflow-hidden flex items-center justify-center">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover rounded-full">
                </div>
            </div>
        </div>

        <p class="text-[11px] text-slate-400">Scan this QR code or click below to <span class="text-emerald-500 font-bold">Install Me</span></p>

        <!-- Install PWA Button -->
        <button id="installBtn" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2 text-xs">
            <span>Install Me</span>
        </button>

        <!-- WhatsApp Share Button -->
        <a href="https://api.whatsapp.com/send?text=Hey!%20Click%20here%20to%20install%20my%20app:%20https://dn.kamalgc.com.np" 
           target="_blank" 
           class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2 text-xs">
            <span>Share on WhatsApp</span>
        </a>

    </div>

    <script>
        // स्थायी QR Code dn.kamalgc.com.np को लागि
        const appUrl = "https://dn.kamalgc.com.np";

        window.onload = function() {
            const qrcodeContainer = document.getElementById('qrcode');
            if (qrcodeContainer && typeof QRCode !== 'undefined') {
                qrcodeContainer.innerHTML = "";
                new QRCode(qrcodeContainer, {
                    text: appUrl,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        };

        // PWA Install Prompt Logic
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            } else {
                alert("This app is either already installed or your browser doesn't support direct installation from this button.");
            }
        });

        // Service Worker दर्ता गर्ने (PWA को लागि अनिवार्य)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>

</body>
</html>
