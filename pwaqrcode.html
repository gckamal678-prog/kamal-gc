<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 320px;
            width: 90%;
        }
        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background: #007bff;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #0056b3;
        }
        .whatsapp-btn {
            background: #25D366;
        }
        .whatsapp-btn:hover {
            background: #1ebe57;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo from root folder -->
        <div class="avatar-container">
            <img src="N512.png" alt="App Logo" class="avatar">
        </div>
        
        <h2>Install Our App</h2>
        <p>Tap below to open and install the app directly to your phone home screen.</p>
        
        <!-- Action Button to Open/Install PWA -->
        <a href="https://dn.kamalgc.com.np" class="btn">Open & Install App</a>
        
        <!-- WhatsApp Share Button -->
        <a href="https://api.whatsapp.com/send?text=Hey!%20Click%20here%20to%20install%20our%20app%20instantly:%20https://dn.kamalgc.com.np" class="btn whatsapp-btn" target="_blank">Share on WhatsApp</a>
    </div>

</body>
</html>
