<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Me - PWA App</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">

<!-- Open Graph Meta Tags (WhatsApp मा Link पठाउँदा देखिने Preview को लागि) -->
<meta property="org:title" content="Digital Notebook - Install App">
<meta property="og:description" content="Scan or click to install our app">
<meta property="og:image" content="https://dn.kamalgc.com.np/N1024.png">
<meta property="og:url" content="https://dn.kamalgc.com.np">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html2canvas Library (HTML लाई फोटो बनाउनको लागि) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- यो पूरा बक्स क्याप्चر भएर फोटो बन्छ -->
    <div id="captureCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-sm w-full flex flex-col items-center text-center space-y-4">
        
        <!-- QR Code Wrapper with Center Logo -->
        <div id="qrcodeWrapper" class="relative inline-block p-3 bg-white rounded-xl shadow-inner">
            <div id="qrcode" class="flex justify-center items-center"></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-9 h-9 rounded-full bg-white border-2 border-emerald-600 p-0.5 shadow-md overflow-hidden flex items-center justify-center">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover rounded-full">
                </div>
            </div>
        </div>

        <p class="text-xs text-slate-300 font-medium">Scan this QR code or click below to <span class="text-emerald-400 font-bold">Install Me</span></p>

        <!-- PWA Install Button -->
        <button id="installBtn" style="display: none;" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2 text-xs">
            <span>Install Me</span>
        </button>

        <!-- Share as Photo Button (तपाईंले मागे जस्तै फोटो बनाएर ह्वाट्सएप वा अन्यत्र पठाउन) -->
        <button id="shareCardBtn" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2 text-xs">
            <span>📷 Share Card as Photo</span>
        </button>

    </div>

    <script>
        // स्थायी QR Code dn.kamalgc.com.np को लागि
        const appUrl = "https://dn.kamalgc.com.np";

        window.onload = function() {
            const qrcodeContainer = document.getElementById('qrcode');
            if (qrcodeContainer && typeof QRCode !== 'undefined') {
                qrcodeContainer.innerHTML = "";
                new QRCode(qrcodeContainer, {
                    text: appUrl,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        };

        // बक्सलाई फोटो (Image) मा बदलेर सेयर वा डाउनलोड गर्ने फंक्सन
        document.getElementById('shareCardBtn').addEventListener('click', async function () {
            const cardElement = document.getElementById('captureCard');
            
            // बटनलाई अस्थायी रूपमा लुकाउने (फोटोमा बटन नदेखियोस भन्नको लागि)
            this.style.display = 'none';

            try {
                // html2canvas प्रयोग गरेर बक्सलाई क्याన్‌भास/फोटोमा बदल्ने
                const canvas = await html2canvas(cardElement, {
                    backgroundColor: '#0f172a', // Tailwind को slate-900 को कलर कोड
                    scale: 2 // हाइ क्वालिटी (HD) फोटोको लागि
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "dn-kamalgc-card.png", { type: "image/png" });
                    
                    // यदि मोबाइल वा ब्राउजरमा Web Share API (Direct Share) सपोर्ट गर्छ भने सिधै ह्वाट्सएपमा पठाउन मिल्छ
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Install My App',
                                text: 'Scan this QR or install my app: https://dn.kamalgc.com.np'
                            });
                        } catch (error) {
                            console.log('Share canceled', error);
                        }
                    } else {
                        // यदि सपोर्ट गर्दैन भने फोटो अटोमेटिक डाउनलोड हुन्छ र ह्वाट्सएपमा म्यानुअल पठाउन सकिन्छ
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'dn-kamalgc-card.png';
                        link.click();
                        alert("Card photo downloaded! Now you can send it on WhatsApp.");
                    }
                });
            } catch (err) {
                console.error("Error generating image: ", err);
                alert("Something went wrong while generating the card image.");
            } finally {
                // बटनलाई फेरि देखाउने
                this.style.display = 'flex';
            }
        });

        // PWA Install Prompt Logic
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            } else {
                alert("This app is already installed.");
            }
        });

        // Service Worker दर्ता गर्ने
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>

</body>
</html>
