<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Health & Utilities</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        Digital NoteBook
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm"></h3>
                    <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Click icon to set photo" data-np="फोटो राख्न क्लिक गर्नुहोस्">Click icon to set photo</span></p>
                </div>
            </div>

            <!-- SIDEBAR NAVIGATION -->
            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span class="lang-text" data-en="Overview" data-np="अवलोकन">Overview</span></a>
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>🛠️</span> <span class="lang-text" data-en="Health & Utilities" data-np="स्वास्थ्य र टूलहरू">Health & Utilities</span></a>
            </nav>

            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-emerald-400"></i> <span class="lang-text" data-en="Personal Info" data-np="व्यक्तिगत विवरण">Personal Info</span>
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Full Name" data-np="पूरा नाम">Full Name</span></label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Address" data-np="ठेगाना">Address</span></label>
                    <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Mobile Number" data-np="मोबाइल नम्बर">Mobile Number</span></label>
                    <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-md">
                    <span class="lang-text" data-en="Save Info" data-np="सेभ गर्नुहोस्">Save Info</span>
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full h-screen overflow-hidden">
        
        <!-- HEADER SECTION -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                        Digital NoteBook
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
                <div class="relative cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="p-4 md:p-6 space-y-4 flex-1 w-full overflow-y-auto">
            
            <!-- 3. पात्रो र समय (Dynamic Calendar) -->
            <div class="flex justify-between items-center px-3 py-3 bg-slate-900 border border-slate-800 rounded-2xl text-white shadow-md">
                <div class="flex items-center space-x-3 w-full">
                    <div class="w-9 h-9 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-calendar-days text-sm"></i>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-400 font-semibold"><span class="lang-text" data-en="Current Date & Time" data-np="हालको मिति र समय">Current Date & Time</span></p>
                        <p id="dynamic-date" class="text-xs md:text-sm font-bold tracking-wide text-emerald-300">Loading...</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 1. BMI क्याल्कुलेटर (Body Mass Index) -->
                <div class="bg-white dark:bg-slate-900 p-4 md:p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2.5 border-b border-slate-100 dark:border-slate-800 pb-3">
                        <div class="w-8 h-8 rounded-xl bg-emerald-600/20 text-emerald-500 flex items-center justify-center">
                            <i class="fa-solid fa-weight-scale text-xs"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-xs md:text-sm">
                            <span class="lang-text" data-en="BMI Calculator (Health Check)" data-np="तौल र स्वास्थ्य जाँच (BMI)">BMI Calculator (Health Check)</span>
                        </h3>
                    </div>

                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1"><span class="lang-text" data-en="Height (in cm)" data-np="उचाइ (सेन्टिमिटरमा)">Height (in cm)</span></label>
                            <input type="number" id="bmi-height" placeholder="e.g. 170" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1"><span class="lang-text" data-en="Weight (in kg)" data-np="तौल (किलोग्राममा)">Weight (in kg)</span></label>
                            <input type="number" id="bmi-weight" placeholder="e.g. 60" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <button onclick="calculateBMI()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">
                            <span class="lang-text" data-en="Calculate BMI" data-np="BMI हिसाब गर्नुहोस्">Calculate BMI</span>
                        </button>
                        
                        <div id="bmi-result" class="hidden p-3 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl text-center space-y-1 mt-2">
                            <p class="text-slate-400 text-[10px]"><span class="lang-text" data-en="Your Result" data-np="तपाईको नतिजा">Your Result</span></p>
                            <h4 id="bmi-score" class="text-sm font-bold text-emerald-400"></h4>
                            <p id="bmi-status" class="text-xs font-semibold text-slate-200"></p>
                        </div>
                    </div>
                </div>

                <!-- 2. उमेर वा मिति क्याल्कुलेटर (Age & Date Calculator) -->
                <div class="bg-white dark:bg-slate-900 p-4 md:p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2.5 border-b border-slate-100 dark:border-slate-800 pb-3">
                        <div class="w-8 h-8 rounded-xl bg-teal-600/20 text-teal-500 flex items-center justify-center">
                            <i class="fa-solid fa-cake-candles text-xs"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-xs md:text-sm">
                            <span class="lang-text" data-en="Date & Age Calculator" data-np="उमेर तथा मिति हिसाब">Date & Age Calculator</span>
                        </h3>
                    </div>

                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1"><span class="lang-text" data-en="Date of Birth" data-np="जन्म मिति">Date of Birth</span></label>
                            <input type="date" id="birth-date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1"><span class="lang-text" data-en="Target / Current Date" data-np="हालको वा लक्षित मिति">Target / Current Date</span></label>
                            <input type="date" id="target-date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <button onclick="calculateAge()" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition shadow-md">
                            <span class="lang-text" data-en="Calculate Age" data-np="उमेर पत्ता लगाउनुहोस्">Calculate Age</span>
                        </button>
                        
                        <div id="age-result" class="hidden p-3 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl text-center space-y-1 mt-2">
                            <p class="text-slate-400 text-[10px]"><span class="lang-text" data-en="Exact Age Difference" data-np="सही उमेर फरक">Exact Age Difference</span></p>
                            <h4 id="age-score" class="text-xs font-bold text-teal-400"></h4>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });

        updateDynamicHeader();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    // ३. पात्रो र समय अपडेट गर्ने फंक्सन
    function updateDynamicHeader() {
        const now = new Date();
        
        const daysNp = ["आइतबार", "सोमबार", "मंगलबार", "बुधबार", "बिहीबार", "शुक्रबार", "शनिबार"];
        const daysEn = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const dayOfWeek = now.getDay();

        let enYear = now.getFullYear();
        let enMonth = now.getMonth(); 
        let enDate = now.getDate();

        const monthsNp = ["वैशाख", "जेठ", "आषाढ", "श्रावण", "भाद्र", "आश्विन", "कार्तिक", "मंसिर", "पौष", "माघ", "फागुन", "चैत"];
        const monthsEn = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];

        let npYear = enYear + 57;
        let npMonthIndex = (enMonth + 8) % 12;
        if(enMonth >= 4 && enDate >= 14) npYear = enYear + 57; 

        let npDate = (enDate + 15) > 30 ? (enDate + 15) % 30 : enDate + 15;
        if(npDate <= 0) npDate = 1;

        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        let dateString = "";
        if (currentLang === 'NEP') {
            dateString = `${daysNp[dayOfWeek]}, ${monthsNp[npMonthIndex]} ${npDate} गते, ${npYear} | ${timeString}`;
        } else {
            dateString = `${daysEn[dayOfWeek]}, ${monthsEn[npMonthIndex]} ${npDate}, ${npYear} | ${timeString}`;
        }

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) {
            dateEl.innerText = dateString;
        }
    }

    setInterval(updateDynamicHeader, 1000);

    // १. BMI क्याल्कुलेटर फंक्सन
    function calculateBMI() {
        const height = parseFloat(document.getElementById('bmi-height').value);
        const weight = parseFloat(document.getElementById('bmi-weight').value);
        const resultBox = document.getElementById('bmi-result');
        const scoreEl = document.getElementById('bmi-score');
        const statusEl = document.getElementById('bmi-status');

        if(!height || !weight || height <= 0 || weight <= 0) {
            alert(currentLang === 'NEP' ? 'कृपया सही उचाइ र तौल प्रविष्ट गर्नुहोस्!' : 'Please enter valid height and weight!');
            return;
        }

        const heightInMeters = height / 100;
        const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(1);
        
        resultBox.classList.remove('hidden');
        scoreEl.innerText = `BMI: ${bmi}`;

        let statusText = "";
        if(bmi < 18.5) {
            statusText = currentLang === 'NEP' ? 'तौल नपुगेको (Underweight)' : 'Underweight';
        } else if(bmi >= 18.5 && bmi < 25) {
            statusText = currentLang === 'NEP' ? 'सामान्य / स्वस्थ तौल (Normal Weight)' : 'Normal / Healthy Weight';
        } else if(bmi >= 25 && bmi < 30) {
            statusText = currentLang === 'NEP' ? 'तौल बढी भएको (Overweight)' : 'Overweight';
        } else {
            statusText = currentLang === 'NEP' ? 'मोटोपन (Obese)' : 'Obese';
        }
        statusEl.innerText = statusText;
    }

    // २. उमेर तथा मिति हिसाब फंक्सन (Age Calculator)
    function calculateAge() {
        const birthInput = document.getElementById('birth-date').value;
        const targetInput = document.getElementById('target-date').value;
        const resultBox = document.getElementById('age-result');
        const scoreEl = document.getElementById('age-score');

        if(!birthInput) {
            alert(currentLang === 'NEP' ? 'कृपया जन्म मिति छान्नुहोस्!' : 'Please select a birth date!');
            return;
        }

        const birthDate = new Date(birthInput);
        const targetDate = targetInput ? new Date(targetInput) : new Date();

        if(birthDate > targetDate) {
            alert(currentLang === 'NEP' ? 'जन्म मिति लक्षित मितिभन्दा पछि हुनुहुँदैन!' : 'Birth date cannot be after target date!');
            return;
        }

        let years = targetDate.getFullYear() - birthDate.getFullYear();
        let months = targetDate.getMonth() - birthDate.getMonth();
        let days = targetDate.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        resultBox.classList.remove('hidden');
        if(currentLang === 'NEP') {
            scoreEl.innerText = `${years} वर्ष, ${months} महिना, ${days} दिन`;
        } else {
            scoreEl.innerText = `${years} Years, ${months} Months, ${days} Days`;
        }
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        alert(currentLang === 'NEP' ? 'विवरण सफलतापूर्वक सेभ भयो!' : 'Details saved successfully!');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address'.value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        const avatarIds = ['sidebar-avatar-img', 'header-avatar-img'];
        avatarIds.forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        
        // Set default target date to today in age calculator
        const todayStr = new Date().toISOString().split('T')[0];
        const targetDateEl = document.getElementById('target-date');
        if(targetDateEl) targetDateEl.value = todayStr;
    });
</script>
</body>
</html>
