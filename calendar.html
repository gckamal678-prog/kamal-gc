<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Health & Utilities</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        Digital NoteBook
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm"></h3>
                    <p class="text-[10px] text-slate-400">Click icon to set photo</p>
                </div>
            </div>

            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span>Overview</span></a>
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>🩺</span> <span>Health & Utilities</span></a>
            </nav>

            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-emerald-400"></i> <span>Personal Info</span>
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span>Full Name</span></label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span>Address</span></label>
                    <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span>Mobile Number</span></label>
                    <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-md">
                    <span>Save Info</span>
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full h-screen overflow-hidden">
        
        <!-- HEADER SECTION -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                        Digital NoteBook
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
                <div class="relative cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="p-3 md:p-4 space-y-3 flex-1 w-full overflow-y-auto">
            
            <!-- 1. NEPALI CALENDAR (FULL WIDTH) -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm p-3 space-y-2">
                <div class="flex items-center justify-between pb-1.5 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center space-x-1.5">
                        <div class="w-6 h-6 rounded-md bg-emerald-600/20 text-emerald-500 flex items-center justify-center">
                            <i class="fa-solid fa-calendar-alt text-[10px]"></i>
                        </div>
                        <h3 id="np-table-title" class="font-bold text-slate-900 dark:text-white text-[11px]">नेपाली पात्रो</h3>
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-1.5 text-center pt-1">
                    <div class="bg-slate-50 dark:bg-slate-800/60 p-2 rounded-lg border border-slate-100 dark:border-slate-800">
                        <p class="text-[9px] text-slate-400" id="th-day">बार</p>
                        <p id="nepali-day" class="font-bold text-emerald-600 dark:text-emerald-400 text-[11px]">-</p>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-800/60 p-2 rounded-lg border border-slate-100 dark:border-slate-800">
                        <p class="text-[9px] text-slate-400" id="th-year">साल</p>
                        <p id="nepali-year" class="font-bold text-[11px]">-</p>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-800/60 p-2 rounded-lg border border-slate-100 dark:border-slate-800">
                        <p class="text-[9px] text-slate-400" id="th-month">महिना</p>
                        <p id="nepali-month" class="font-bold text-[11px]">-</p>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-800/60 p-2 rounded-lg border border-slate-100 dark:border-slate-800">
                        <p class="text-[9px] text-slate-400" id="th-date">गते</p>
                        <p id="nepali-date" class="font-bold text-[11px]">-</p>
                    </div>
                </div>
            </div>

            <!-- 2. LIVE ENGLISH CALENDAR & TIME (FULL WIDTH) -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm p-3 flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-500 shrink-0">
                    <i class="fa-solid fa-calendar-days text-xs"></i>
                </div>
                <div class="overflow-hidden">
                    <p class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider"><span id="lbl-curr-time">Current Date & Time</span></p>
                    <p id="dynamic-date" class="text-[11px] font-bold tracking-wide truncate">Loading...</p>
                </div>
            </div>

            <!-- 3. BMI CALCULATOR (COLLAPSIBLE) -->
            <div class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">
                <div onclick="toggleBmiContent()" class="flex items-center justify-between pb-1.5 border-b border-slate-100 dark:border-slate-800 cursor-pointer select-none">
                    <div class="flex items-center space-x-1.5">
                        <div class="w-6 h-6 rounded-md bg-emerald-600/20 text-emerald-500 flex items-center justify-center">
                            <i class="fa-solid fa-weight-scale text-[10px]"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-[11px]"><span id="bmi-title">BMI Calculator</span></h3>
                    </div>
                    <i id="bmi-arrow" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-300"></i>
                </div>

                <div id="bmi-content" class="hidden space-y-2 pt-1">
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[9px] font-semibold text-slate-500 dark:text-slate-400 mb-0.5"><span id="lbl-height-ft">Ft</span></label>
                            <input type="number" id="bmi-feet" placeholder="5" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[9px] font-semibold text-slate-500 dark:text-slate-400 mb-0.5"><span id="lbl-height-in">Inch</span></label>
                            <input type="number" id="bmi-inch" placeholder="10" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[9px] font-semibold text-slate-500 dark:text-slate-400 mb-0.5"><span id="lbl-weight">Kg</span></label>
                            <input type="number" id="bmi-weight" placeholder="53" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-slate-900 dark:text-white text-xs outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <button onclick="calculateBMI()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-sm text-[11px]">
                        <span id="btn-calc-bmi">Calculate BMI</span>
                    </button>

                    <div id="bmi-result" class="hidden p-2 bg-slate-50 dark:bg-slate-800/60 rounded-lg border border-slate-200 dark:border-slate-700 text-center space-y-0.5">
                        <p class="text-[11px] font-bold text-slate-800 dark:text-white" id="bmi-score-text"></p>
                        <p class="text-[10px] font-medium" id="bmi-status-text"></p>
                    </div>
                </div>
            </div>

            <!-- 4. DATE & AGE CALCULATOR (COLLAPSIBLE) -->
            <div class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">
                <div onclick="toggleAgeContent()" class="flex items-center justify-between pb-1.5 border-b border-slate-100 dark:border-slate-800 cursor-pointer select-none">
                    <div class="flex items-center space-x-1.5">
                        <div class="w-6 h-6 rounded-md bg-emerald-600/20 text-emerald-500 flex items-center justify-center">
                            <i class="fa-solid fa-cake-candles text-[10px]"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-[11px]"><span id="age-title">Age Calculator</span></h3>
                    </div>
                    <i id="age-arrow" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-300"></i>
                </div>

                <div id="age-content" class="hidden space-y-2 pt-1">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[9px] font-semibold text-slate-500 dark:text-slate-400 mb-0.5"><span id="lbl-dob">DOB</span></label>
                            <input type="date" id="birth-date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-slate-900 dark:text-white text-[10px] outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[9px] font-semibold text-slate-500 dark:text-slate-400 mb-0.5"><span id="lbl-target-date">Target Date</span></label>
                            <input type="date" id="target-date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-slate-900 dark:text-white text-[10px] outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <button onclick="calculateAge()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-sm text-[11px]">
                        <span id="btn-calc-age">Calculate Age</span>
                    </button>

                    <div id="age-result" class="hidden p-2 bg-slate-50 dark:bg-slate-800/60 rounded-lg border border-slate-200 dark:border-slate-700 text-center">
                        <p class="text-[11px] font-bold text-slate-800 dark:text-white" id="age-score-text"></p>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    function toggleBmiContent() {
        const content = document.getElementById('bmi-content');
        const arrow = document.getElementById('bmi-arrow');
        if(content) content.classList.toggle('hidden');
        if(arrow) arrow.classList.toggle('rotate-180');
    }

    function toggleAgeContent() {
        const content = document.getElementById('age-content');
        const arrow = document.getElementById('age-arrow');
        if(content) content.classList.toggle('hidden');
        if(arrow) arrow.classList.toggle('rotate-180');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        if (currentLang === 'NEP') {
            document.getElementById('np-table-title').innerText = "नेपाली पात्रो";
            document.getElementById('th-day').innerText = "बार";
            document.getElementById('th-year').innerText = "साल";
            document.getElementById('th-month').innerText = "महिना";
            document.getElementById('th-date').innerText = "गते";
            document.getElementById('lbl-curr-time').innerText = "वर्तमान मिति र समय";
            document.getElementById('bmi-title').innerText = "बिएमआई क्याल्कुलेटर";
            document.getElementById('lbl-height-ft').innerText = "फिट";
            document.getElementById('lbl-height-in').innerText = "इन्च";
            document.getElementById('lbl-weight').innerText = "तौल (केजी)";
            document.getElementById('btn-calc-bmi').innerText = "बिएमआई गणना";
            document.getElementById('age-title').innerText = "उमेर क्याल्कुलेटर";
            document.getElementById('lbl-dob').innerText = "जन्म मिति";
            document.getElementById('lbl-target-date').innerText = "लक्ष्य मिति";
            document.getElementById('btn-calc-age').innerText = "उमेर गणना";
        } else {
            document.getElementById('np-table-title').innerText = "Nepali Calendar";
            document.getElementById('th-day').innerText = "Day";
            document.getElementById('th-year').innerText = "Year";
            document.getElementById('th-month').innerText = "Month";
            document.getElementById('th-date').innerText = "Date";
            document.getElementById('lbl-curr-time').innerText = "Current Date & Time";
            document.getElementById('bmi-title').innerText = "BMI Calculator";
            document.getElementById('lbl-height-ft').innerText = "Ft";
            document.getElementById('lbl-height-in').innerText, "Inch";
            document.getElementById('lbl-weight').innerText = "Kg";
            document.getElementById('btn-calc-bmi').innerText = "Calculate BMI";
            document.getElementById('age-title').innerText = "Age Calculator";
            document.getElementById('lbl-dob').innerText = "DOB";
            document.getElementById('lbl-target-date').innerText = "Target Date";
            document.getElementById('btn-calc-age').innerText = "Calculate Age";
        }
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
        loadNepaliCalendar();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    // यहाँ दिन र बार कहिल्यै नमिल्ने गरी वास्तविक रूपमा रूपान्तरण गर्ने एल्गोरिदम मिलाइएको छ
    function loadNepaliCalendar() {
        const daysNp = ["आइतबार", "सोमबार", "मंगलबार", "बुधबार", "बिहीबार", "शुक्रबार", "शनिबार"];
        const daysEn = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        const monthsNpNames = ["आश्विन", "कार्तिक", "मार्गशीर्ष", "पौष", "माघ", "फाल्गुन", "चैत्र", "वैशाख", "जेठ", "आषाढ", "श्रावण", "भाद्र"];
        const monthsEnNames = ["Ashoj", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra", "Baishakh", "Jestha", "Ashadh", "Shrawan", "Bhadra"];
        
        // तपाईंले दिनुभएको महिना अनुसार दिनहरूको सही क्रम (असोजदेखि भदौसम्म)
        const monthDays = [31, 30, 29, 30, 29, 30, 30, 31, 31, 32, 31, 31];

        const now = new Date();
        const dayOfWeek = now.getDay(); // वास्तविक बार (0-6)

        // सहि आधार मितિ (Reference: 2026-09-23 लाई विक्रम संवत् २०८३ आश्विन ८ गते मान्दै निरन्तर हिसाब गर्ने)
        const refEngDate = new Date(2026, 8, 23); // Sep 23, 2026
        const diffTime = now.setHours(0,0,0,0) - refEngDate.setHours(0,0,0,0);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        // २०८३ आश्विन ८ बाट सुरु गरेर दिनहरूको हिसाब गर्ने
        let totalDaysFromStart = 7 + diffDays; // आश्विन १ बाट गन्दा ७ दिन अगाडि
        let currentYear = 2083;
        let monthIdx = 0; // 0 = आश्विन
        let currentDateInMonth = 1;

        if (totalDaysFromStart >= 0) {
            let tempDays = totalDaysFromStart;
            while (tempDays >= monthDays[monthIdx]) {
                tempDays -= monthDays[monthIdx];
                monthIdx++;
                if (monthIdx >= 12) {
                    monthIdx = 0;
                    currentYear++;
                }
            }
            currentDateInMonth = tempDays + 1;
        } else {
            // यदि पछाडिको मिति भएमा (आवश्यक परेमा)
            monthIdx = 0;
            currentDateInMonth = 1;
        }

        let npYearStr = currentYear === 2083 ? "२०८३" : currentYear.toString();
        let enYearStr = currentYear.toString();

        if (currentLang === 'NEP') {
            document.getElementById('nepali-day').innerText = daysNp[dayOfWeek];
            document.getElementById('nepali-year').innerText = npYearStr;
            document.getElementById('nepali-month').innerText = monthsNpNames[monthIdx];
            document.getElementById('nepali-date').innerText = currentDateInMonth;
        } else {
            document.getElementById('nepali-day').innerText = daysEn[dayOfWeek];
            document.getElementById('nepali-year').innerText = enYearStr;
            document.getElementById('nepali-month').innerText = monthsEnNames[monthIdx];
            document.getElementById('nepali-date').innerText = currentDateInMonth;
        }
    }

    function updateDynamicHeader() {
        const now = new Date();
        const daysEn = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const monthsEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let day = now.getDay();
        let date = now.getDate();
        let month = now.getMonth();
        let year = now.getFullYear();
        let timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

        let dateString = `${daysEn[day]}, ${monthsEn[month]} ${date}, ${year} | ${timeString}`;
        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = dateString;
    }

    setInterval(updateDynamicHeader, 1000);

    function calculateBMI() {
        const feet = parseFloat(document.getElementById('bmi-feet').value) || 0;
        const inches = parseFloat(document.getElementById('bmi-inch').value) || 0;
        const weight = parseFloat(document.getElementById('bmi-weight').value) || 0;

        if ((feet === 0 && inches === 0) || weight <= 0) return;

        const totalInches = (feet * 12) + inches;
        const heightInMeters = totalInches * 0.0254;
        const bmi = weight / (heightInMeters * heightInMeters);
        
        const resultBox = document.getElementById('bmi-result');
        const scoreText = document.getElementById('bmi-score-text');
        const statusText = document.getElementById('bmi-status-text');

        resultBox.classList.remove('hidden');
        scoreText.innerText = `BMI: ${bmi.toFixed(1)}`;

        let status = "";
        let colorClass = "";

        if (bmi < 18.5) {
            status = currentLang === 'NEP' ? 'तौल कम (Underweight)' : 'Underweight';
            colorClass = 'text-amber-500';
        } else if (bmi >= 18.5 && bmi < 24.9) {
            status = currentLang === 'NEP' ? 'सामान्य (Normal)' : 'Healthy';
            colorClass = 'text-emerald-500';
        } else if (bmi >= 25 && bmi < 29.9) {
            status = currentLang === 'NEP' ? 'तौल बढी (Overweight)' : 'Overweight';
            colorClass = 'text-orange-500';
        } else {
            status = currentLang === 'NEP' ? 'मोटोपना (Obese)' : 'Obese';
            colorClass = 'text-rose-500';
        }

        statusText.innerHTML = `<span class="${colorClass} font-bold">${status}</span>`;
    }

    function calculateAge() {
        const birthInput = document.getElementById('birth-date').value;
        const targetInput = document.getElementById('target-date').value;

        if (!birthInput) return;

        const birthDate = new Date(birthInput);
        const targetDate = targetInput ? new Date(targetInput) : new Date();

        if (birthDate > targetDate) return;

        let years = targetDate.getFullYear() - birthDate.getFullYear();
        let months = targetDate.getMonth() - birthDate.getMonth();
        let days = targetDate.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        const ageBox = document.getElementById('age-result');
        const scoreText = document.getElementById('age-score-text');

        ageBox.classList.remove('hidden');
        if (currentLang === 'NEP' ) {
            scoreText.innerText = `${years} वर्ष, ${months} महिना, ${days} दिन`;
        } else {
            scoreText.innerText = `${years} Y, ${months} M, ${days} D`;
        }
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile-number').value || document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files.item(0);
        if (file) {
            const readerObj = new FileReader();
            readerObj.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            readerObj.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadNepaliCalendar();
        loadUserData();
        loadAvatar();

        const todayStr = new Date().toISOString().split('T')[0];
        const targetDateEl = document.getElementById('target-date');
        if(targetDateEl) targetDate.value = todayStr;
    });
</script>
